<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Hannah&#8217;s Bunny Simulator</title>
    <meta name="theme-color" content="#2b1a12" />
    <meta name="apple-mobile-web-app-title" content="Hannah&#8217;s Bunny" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="A cozy 3D bunny to pet, feed and play with." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Shown instantly while the app downloads; React replaces it. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(circle at 50% 120%, #a8573c, #2b1a12 70%); color: #fff;
        font-family: ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-align: center; }
      .boot img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(255, 150, 120, 0.4); animation: bootbob 1.6s ease-in-out infinite; }
      .boot b { font-size: 22px; letter-spacing: 0.3px; }
      .boot span { font-size: 13px; opacity: 0.7; }
      @keyframes bootbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><div class="boot"><img src="%BASE_URL%apple-touch-icon.png" alt="" /><b>Hannah&#8217;s Bunny Simulator</b><span>Waking up the bunny...</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
